name: USB builder CI
on:
  push:
    paths:
      - '.github/workflows/usb-ci.yml'
      - 'install.sh'
      - 'lib/**'
      - 'firstboot-complete.sh'
      - 'register-runner.sh'
      - 'config/**'
      - 'tests/**'
  pull_request:
  workflow_dispatch:
    inputs:
      level:
        description: 'test depth'
        type: choice
        options: [static, vga, image, boot]
        default: static
      minimal_image:
        description: 'CI-only minimal Ubuntu profile (no developer packages)'
        type: boolean
        default: true
      include_firmware:
        description: 'Download linux-firmware (large, omit by default)'
        type: boolean
        default: false
      cache_debs:
        description: 'GitHub Actions apt .deb cache (transfers cache data)'
        type: boolean
        default: true
      login_user:
        description: 'CI login account to test'
        type: string
        default: developer
      runner_user:
        description: 'CI Actions account to test'
        type: string
        default: buildbot
permissions:
  contents: read
concurrency:
  group: usb-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Syntax, safety and configurable-user tests
        run: |
          bash tests/static-check.sh
          sudo bash tests/safety-test.sh
          if command -v shellcheck >/dev/null; then
            shellcheck -S error install.sh lib/provision.sh firstboot-complete.sh register-runner.sh tests/*.sh
          fi
  vga:
    needs: safety
    if: (github.event_name == 'workflow_dispatch' && inputs.level == 'vga') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[vga-ci-once]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU only when absent
        run: |
          if ! command -v qemu-system-x86_64 >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends qemu-system-x86
          fi
      - name: SeaBIOS VGA framebuffer and HMP keyboard smoke
        run: bash tests/vga-smoke.sh
      - name: Upload VGA smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usb-vga-smoke
          path: |
            ${{ runner.temp }}/usb-vga-smoke.png
            ${{ runner.temp }}/usb-vga-smoke-qemu.log
            ${{ runner.temp }}/usb-vga-smoke-observer.log
            ${{ runner.temp }}/usb-vga-smoke-boot-frames/*.png
          if-no-files-found: ignore
  image:
    needs: safety
    if: (github.event_name == 'workflow_dispatch' && (inputs.level == 'image' || inputs.level == 'boot')) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[image-ci-once]') || contains(github.event.head_commit.message, '[boot-ci-once]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      USB_LOGIN_USER: ${{ inputs.login_user }}
      USB_RUNNER_USER: ${{ inputs.runner_user }}
      USB_SKIP_FIRMWARE: ${{ inputs.include_firmware && '0' || '1' }}
      USB_CI_EXPLICIT: 'yes'
      USB_CI_KEEP_KEY: '1'
      USB_CI_VERIFY_ONBOARD: '1'
      USB_CI_VGA_LOGIN: '1'
      USB_CI_MINIMAL: ${{ ((github.event_name == 'workflow_dispatch' && inputs.minimal_image) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[boot-ci-once]'))) && '1' || '0' }}
      CACHE_ENABLED: ${{ (github.event_name == 'workflow_dispatch' && inputs.cache_debs) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[boot-ci-once]')) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set isolated working paths
        run: |
          echo "IMAGE=$RUNNER_TEMP/ubuntu-usb-ci.raw" >> "$GITHUB_ENV"
          echo "CACHE=$RUNNER_TEMP/ubuntu-usb-apt-cache" >> "$GITHUB_ENV"
      - name: Measure network at start
        run: bash tests/network-bytes.sh | tee "${{ runner.temp }}/network-start.txt"
      - name: Host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends debootstrap gdisk parted dosfstools e2fsprogs qemu-system-x86 ovmf
      - name: Validate target Ubuntu package availability
        run: |
          while IFS= read -r package; do
            [[ "$package" =~ ^[a-z0-9][a-z0-9+.-]*$ ]] || continue
            [[ "$package" == linux-firmware && "$USB_SKIP_FIRMWARE" == 1 ]] && continue
            apt-cache show "$package" >/dev/null || { echo "Missing package: $package" >&2; exit 1; }
          done < config/packages.txt
          if [[ "$USB_CI_MINIMAL" == 1 ]]; then
            while IFS= read -r package; do
              [[ "$package" =~ ^[a-z0-9][a-z0-9+.-]*$ ]] || continue
              apt-cache show "$package" >/dev/null || { echo "Missing minimal package: $package" >&2; exit 1; }
            done < config/packages-vga.txt
          fi
      - name: Restore cached .deb packages (optional)
        id: aptcache
        if: env.CACHE_ENABLED == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CACHE }}
          key: noble-amd64-debs-v2-${{ env.USB_CI_MINIMAL }}-${{ hashFiles('config/packages.txt', 'config/packages-vga.txt') }}-${{ inputs.include_firmware && 'withfw' || 'nofw' }}
      - name: Build and inspect isolated image
        id: imagebuild
        run: |
          mkdir -p "$CACHE"
          if [[ "$CACHE_ENABLED" != "true" ]]; then
            unset USB_APT_CACHE_DIR
          else
            export USB_APT_CACHE_DIR="$CACHE"
          fi
          sudo -E bash tests/build-image.sh "$IMAGE"
          df -h
      - name: Prepare .deb cache for unprivileged Actions archive save
        if: always() && env.CACHE_ENABLED == 'true'
        run: |
          [[ "$CACHE" == "$RUNNER_TEMP/ubuntu-usb-apt-cache" && -d "$CACHE" && ! -L "$CACHE" ]] || {
            echo 'Unexpected APT cache directory: refusing permission changes' >&2
            exit 1
          }
          if mountpoint -q "$CACHE"; then
            echo 'APT cache is still mounted: refusing archive save' >&2
            exit 1
          fi
          # APT created root-owned lock/partial entries, which made
          # actions/cache/save fail with tar Permission denied.
          sudo rm -rf -- "$CACHE/partial"
          sudo rm -f -- "$CACHE/lock"
          sudo chown -R "$(id -u):$(id -g)" "$CACHE"
          sudo chmod -R u+rwX "$CACHE"
          printf 'Readable .deb files: '
          find "$CACHE" -maxdepth 1 -type f -name '*.deb' | wc -l
          du -sh "$CACHE"
      - name: BIOS boot (live serial, 180s hard limit)
        id: biosboot
        if: (github.event_name == 'workflow_dispatch' && inputs.level == 'boot') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[boot-ci-once]'))
        run: |
          if timeout --signal=TERM --kill-after=10s 180s bash tests/qemu-boot.sh bios "$IMAGE" "${{ runner.temp }}/qemu-bios.log"; then
            echo "PASS: BIOS QEMU integration completed within 180s"
          else
            rc=$?
            if (( rc == 124 )); then
              echo "FAIL: BIOS QEMU integration exceeded 180s total; full ttyS0 log retained" >&2
              tail -n 30 "${{ runner.temp }}/qemu-bios.log" >&2 || :
            fi
            exit "$rc"
          fi
      - name: UEFI boot (live serial, 180s hard limit)
        # Always attempt UEFI once the image was built, even when BIOS/PAM fails.
        # On a BIOS failure, check UEFI boot+VGA only (no onboarding dependency).
        if: always() && steps.imagebuild.outcome == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.level == 'boot') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[boot-ci-once]')))
        env:
          USB_CI_VERIFY_ONBOARD: ${{ steps.biosboot.outcome == 'success' && '1' || '0' }}
        run: |
          echo "UEFI verification mode: $([[ $USB_CI_VERIFY_ONBOARD == 1 ]] && echo full-onboarding || echo boot-and-vga-only)"
          if timeout --signal=TERM --kill-after=10s 180s bash tests/qemu-boot.sh uefi "$IMAGE" "${{ runner.temp }}/qemu-uefi.log"; then
            echo "PASS: UEFI QEMU integration completed within 180s"
          else
            rc=$?
            if (( rc == 124 )); then
              echo "FAIL: UEFI QEMU integration exceeded 180s total; full ttyS0 log retained" >&2
              tail -n 30 "${{ runner.temp }}/qemu-uefi.log" >&2 || :
            fi
            exit "$rc"
          fi
      - name: Remove temporary CI SSH credentials
        if: always()
        run: sudo rm -f "$RUNNER_TEMP/usb-ci-ssh-key" "$RUNNER_TEMP/usb-ci-ssh-key.pub" "$RUNNER_TEMP/usb-ci-initial-password" "$RUNNER_TEMP/usb-ci-next-password"
      - name: Network usage summary
        if: always()
        run: |
          bash tests/network-bytes.sh | tee "${{ runner.temp }}/network-end.txt"
          echo '## Network byte counters (including Actions cache traffic)' >> "$GITHUB_STEP_SUMMARY"
          cat "${{ runner.temp }}/network-start.txt" "${{ runner.temp }}/network-end.txt" >> "$GITHUB_STEP_SUMMARY"
          awk 'NR==1 {sr=$1; st=$2} NR==2 {printf "\\nRX delta: %.1f MiB; TX delta: %.1f MiB\\n", ($1-sr)/1048576, ($2-st)/1048576}' "${{ runner.temp }}/network-start.txt" "${{ runner.temp }}/network-end.txt" >> "$GITHUB_STEP_SUMMARY"
          du -sh "$CACHE" 2>/dev/null || true
          du -sh "$IMAGE" 2>/dev/null || true
      - name: Save .deb cache (optional, cache miss only)
        if: always() && env.CACHE_ENABLED == 'true' && steps.aptcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CACHE }}
          key: noble-amd64-debs-v2-${{ env.USB_CI_MINIMAL }}-${{ hashFiles('config/packages.txt', 'config/packages-vga.txt') }}-${{ inputs.include_firmware && 'withfw' || 'nofw' }}
      - name: Upload boot and measurement logs (never upload disk image)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usb-ci-logs
          path: |
            ${{ runner.temp }}/qemu-*.log
            ${{ runner.temp }}/qemu-*-vga-*.png
            ${{ runner.temp }}/qemu-*-boot-frames/*.png
            ${{ runner.temp }}/network-*.txt
          if-no-files-found: ignore
